<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Promociones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 flex items-center gap-3">
            <i class="bi bi-speedometer2"></i>
            Test del Sistema de Promociones
        </h1>

        <div class="space-y-6">
            <!-- Test 1: Verificar Tablas -->
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-sm">1</span>
                    Verificar Tablas de Base de Datos
                </h2>
                <button onclick="verificarTablas()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg">
                    <i class="bi bi-database-check mr-2"></i>
                    Verificar
                </button>
                <div id="result-tablas" class="mt-4"></div>
            </div>

            <!-- Test 2: Listar Promociones -->
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-sm">2</span>
                    Listar Promociones
                </h2>
                <button onclick="listarPromociones()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg">
                    <i class="bi bi-list-ul mr-2"></i>
                    Listar
                </button>
                <div id="result-promociones" class="mt-4"></div>
            </div>

            <!-- Test 3: Crear Promoción 2x1 -->
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 bg-yellow-500 rounded-full flex items-center justify-center text-sm">3</span>
                    Crear Promoción 2x1 de Prueba
                </h2>
                <button onclick="crearPromocion2x1()" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded-lg">
                    <i class="bi bi-plus-circle mr-2"></i>
                    Crear 2x1
                </button>
                <div id="result-crear" class="mt-4"></div>
            </div>

            <!-- Test 4: Calcular en Orden Mock -->
            <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center text-sm">4</span>
                    Simular Cálculo (necesita orden real)
                </h2>
                <div class="flex gap-2">
                    <input type="number" id="orden_id_test" placeholder="ID de orden" class="bg-gray-700 rounded px-3 py-2 w-32">
                    <button onclick="calcularPromociones()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg">
                        <i class="bi bi-calculator mr-2"></i>
                        Calcular
                    </button>
                </div>
                <div id="result-calcular" class="mt-4"></div>
            </div>
        </div>

        <!-- Resumen -->
        <div class="mt-8 p-6 bg-gray-800 rounded-lg border-2 border-green-500/50">
            <h3 class="text-xl font-bold mb-2 text-green-400">✅ Pasos Completados</h3>
            <ul id="checklist" class="space-y-2 text-sm">
                <li id="check-1" class="text-gray-400">○ Tablas verificadas</li>
                <li id="check-2" class="text-gray-400">○ Promociones listadas</li>
                <li id="check-3" class="text-gray-400">○ Promoción creada</li>
                <li id="check-4" class="text-gray-400">○ Cálculo probado</li>
            </ul>
        </div>
    </div>

    <script>
        function mostrarResultado(containerId, html, tipo = 'info') {
            const container = document.getElementById(containerId);
            const colores = {
                'success': 'bg-green-500/20 border-green-500/50 text-green-300',
                'error': 'bg-red-500/20 border-red-500/50 text-red-300',
                'info': 'bg-blue-500/20 border-blue-500/50 text-blue-300'
            };
            container.innerHTML = `<div class="p-4 rounded-lg border ${colores[tipo]}">${html}</div>`;
        }

        function marcarCheck(num) {
            const check = document.getElementById('check-' + num);
            if (check) {
                check.className = 'text-green-400';
                check.textContent = '✓ ' + check.textContent.substring(2);
            }
        }

        async function verificarTablas() {
            mostrarResultado('result-tablas', '<i class="bi bi-arrow-repeat animate-spin"></i> Verificando...', 'info');
            
            try {
                const response = await fetch('/POS/api/promotionsController/install_promociones.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'verify'})
                });
                
                const data = await response.json();
                
                if (data.status === 'ok') {
                    let html = '<div class="space-y-2">';
                    Object.keys(data.tablas).forEach(tabla => {
                        const existe = data.tablas[tabla];
                        html += `<div class="flex items-center gap-2">
                            <i class="bi ${existe ? 'bi-check-circle-fill text-green-400' : 'bi-x-circle-fill text-red-400'}"></i>
                            <span>${tabla}: ${existe ? 'EXISTE' : 'NO EXISTE'}</span>
                        </div>`;
                    });
                    html += '</div>';
                    
                    if (data.todas_instaladas) {
                        mostrarResultado('result-tablas', html, 'success');
                        marcarCheck(1);
                    } else {
                        html += '<p class="mt-3 text-yellow-300">⚠️ Ejecuta el instalador primero</p>';
                        mostrarResultado('result-tablas', html, 'error');
                    }
                } else {
                    mostrarResultado('result-tablas', '❌ Error: ' + data.msg, 'error');
                }
            } catch (error) {
                mostrarResultado('result-tablas', '❌ Error: ' + error.message, 'error');
            }
        }

        async function listarPromociones() {
            mostrarResultado('result-promociones', '<i class="bi bi-arrow-repeat animate-spin"></i> Cargando...', 'info');
            
            try {
                const response = await fetch('/POS/api/promotionsController/api.php?action=list');
                const data = await response.json();
                
                if (data.status === 'ok') {
                    if (data.data.length === 0) {
                        mostrarResultado('result-promociones', '📭 No hay promociones. Crea una en el paso 3.', 'info');
                    } else {
                        let html = `<div class="space-y-2"><strong>Total: ${data.data.length} promociones</strong>`;
                        data.data.forEach(promo => {
                            html += `<div class="bg-gray-700/50 p-2 rounded">
                                <strong>${promo.nombre}</strong> - ${promo.tipo}
                                ${promo.activa == 1 ? '<span class="text-green-400">(Activa)</span>' : '<span class="text-gray-400">(Inactiva)</span>'}
                            </div>`;
                        });
                        html += '</div>';
                        mostrarResultado('result-promociones', html, 'success');
                        marcarCheck(2);
                    }
                } else {
                    mostrarResultado('result-promociones', '❌ Error: ' + data.msg, 'error');
                }
            } catch (error) {
                mostrarResultado('result-promociones', '❌ Error: ' + error.message, 'error');
            }
        }

        async function crearPromocion2x1() {
            mostrarResultado('result-crear', '<i class="bi bi-arrow-repeat animate-spin"></i> Creando...', 'info');
            
            try {
                const data = {
                    nombre: '2x1 Test Bebidas',
                    descripcion: 'Promoción de prueba creada automáticamente',
                    tipo: '2x1',
                    aplica_a: 'categorias',
                    activa: 1,
                    prioridad: 5,
                    minimo_productos: 2,
                    aplicar_mayor_valor: 1,
                    categorias: ['bebidas']
                };
                
                const response = await fetch('/POS/api/promotionsController/api.php?action=create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.status === 'ok') {
                    mostrarResultado('result-crear', `✅ Promoción creada con ID: ${result.id}<br>Nombre: ${data.nombre}`, 'success');
                    marcarCheck(3);
                } else {
                    mostrarResultado('result-crear', '❌ Error: ' + result.msg, 'error');
                }
            } catch (error) {
                mostrarResultado('result-crear', '❌ Error: ' + error.message, 'error');
            }
        }

        async function calcularPromociones() {
            const ordenId = document.getElementById('orden_id_test').value;
            
            if (!ordenId) {
                mostrarResultado('result-calcular', '⚠️ Ingresa un ID de orden', 'info');
                return;
            }
            
            mostrarResultado('result-calcular', '<i class="bi bi-arrow-repeat animate-spin"></i> Calculando...', 'info');
            
            try {
                const response = await fetch('/POS/api/promotionsController/calcular_orden.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `orden_id=${ordenId}&es_personal=0`
                });
                
                const data = await response.json();
                
                if (data.status === 'ok') {
                    if (data.tiene_promociones) {
                        let html = `<div class="space-y-2">
                            <strong>✅ ${data.promociones.length} promoción(es) aplicada(s)</strong>
                            <div class="space-y-1">`;
                        
                        data.promociones.forEach(promo => {
                            html += `<div class="bg-green-500/10 p-2 rounded">
                                ${promo.nombre}: -$${promo.monto.toFixed(2)}
                                ${promo.detalle ? `<br><small class="text-gray-400">${promo.detalle}</small>` : ''}
                            </div>`;
                        });
                        
                        html += `</div>
                            <div class="font-bold text-green-400 text-lg">
                                Total ahorrado: $${data.total_descuentos.toFixed(2)}
                            </div>
                        </div>`;
                        
                        mostrarResultado('result-calcular', html, 'success');
                        marcarCheck(4);
                    } else {
                        mostrarResultado('result-calcular', '📭 No hay promociones aplicables para esta orden', 'info');
                    }
                } else {
                    mostrarResultado('result-calcular', '❌ Error: ' + data.msg, 'error');
                }
            } catch (error) {
                mostrarResultado('result-calcular', '❌ Error: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
